name: OmicsAtlas-AI update and deploy

on:
  schedule:
    # Sunday 00:23 UTC / 08:23 Asia/Shanghai; avoids the busiest hourly slot.
    - cron: '23 0 * * 0'
  workflow_dispatch:
    inputs:
      collect:
        description: Refresh the directory before deploying
        type: boolean
        default: true
      request_budget:
        description: Maximum HTTP requests (including public README reads)
        type: number
        default: 800
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements*.txt'
      - '.github/workflows/main.yml'

permissions:
  contents: read

# Collection and deployment are one serial production operation. An in-flight
# update must not be cancelled after committing its observations.
concurrency:
  group: omicsatlas-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Backend regression checks
        run: python -m unittest discover -s tests
      - name: Collect an incremental snapshot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST_BUDGET: ${{ inputs.request_budget || 800 }}
        run: python scripts/update_catalog.py --request-budget "$REQUEST_BUDGET"
      - name: Validate the complete public catalog
        run: python scripts/update_catalog.py --validate
      - name: Check classification regressions
        run: python scripts/evaluate.py
      - name: Install the test browser
        run: python -m playwright install --with-deps chromium
      - name: Verify the actual site before persisting or publishing
        run: |
          python tests/browser_check.py
          python tests/native_zoom_check.py
      - name: Persist observations and the matching public snapshot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json data/runs.json docs/data/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh OmicsAtlas-AI directory"
            git push origin HEAD:main
          fi
      - name: Record snapshot coverage
        run: python scripts/run_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Package exactly the persisted site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
